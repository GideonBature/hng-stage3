user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format hng_json escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time'
        '}';

    access_log /var/log/nginx/hng-access.log hng_json;

    sendfile on;
    keepalive_timeout 65;

    # Nextcloud - accessed by IP
    server {
        listen 80 default_server;
        server_name _;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        location / {
            proxy_pass http://nextcloud:80;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            client_max_body_size 10G;
        }
    }

    # Detector dashboard - accessed by subdomain
    server {
        listen 80;
        server_name detector-gideonbature.duckdns.org;

        location / {
            proxy_pass http://detector:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
