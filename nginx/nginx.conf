user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Trust X-Forwarded-For from all sources (adjust if behind a known proxy)
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # JSON access log format
    log_format hng_json escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/hng-access.log hng_json;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Forward real client IP to upstream
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # Proxy all traffic to Nextcloud
        location / {
            proxy_pass http://nextcloud:80;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            client_max_body_size 10G;
        }
    }

    # Dashboard server block (served on port 8080 via separate service,
    # but we add a passthrough here for convenience)
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://detector:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
